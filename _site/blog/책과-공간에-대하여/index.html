                <p>집 공간이 줄어들기 때문에 종이책보다 전자책을 읽자는 생각을 한다. 그러나 책은 중고로 거래할 수도 있고, 맡기는 서비스(국민도서관)도 있으니 다시 종이책을 읽고, 줄치고, 메모해본다. 좋아하는 것을 추구하자. 이 생각은 북커버와 전자책으로 나올 수 없는 어떤 책을 구매한 이후로 갖게된 것이다. 전자책으로 읽을 수 없는 것이 너무 많다.</p>
