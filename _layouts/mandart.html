    <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: #f8f8f8;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .input-section, .output-section {
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    /* 만다라트 테이블 스타일 업데이트 */
    .mandala-table {
      border-collapse: collapse;
      margin-top: 5px;
    }

    .mandala-cell {
      width: 80px;
      height: 80px;
      border: 1px solid #333;
      text-align: center;
      vertical-align: middle;
      font-size: 12px;
      padding: 3px;
      overflow: hidden;
      word-break: keep-all;
    }

    .center-cell {
      background-color: #e6f7ff;
      font-weight: bold;
    }
    .share-container {
      margin-top: 30px;
      padding: 15px;
      border-radius: 8px;
      background-color: #f8f9fa;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .share-btn {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #4a89dc;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      align-items: center;
      justify-content: center;
    }

    .share-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .share-btn.twitter {
      background-color: #1DA1F2;
    }

    .dim-cell {
      opacity: 0.5;
      background-color: #f5f5f5;
    }

    /* 영역 테두리 강조 */
    .subgoal-1 { border: 2px solid #d9534f; }   /* 빨강 */
    .subgoal-2 { border: 2px solid #5bc0de; }   /* 파랑 */
    .subgoal-3 { border: 2px solid #5cb85c; }   /* 초록 */
    .subgoal-4 { border: 2px solid #f0ad4e; }   /* 주황 */

    /* 기본 PC 레이아웃은 유지 */
    .mandala-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, auto);
      gap: 10px;
      max-width: 100%;
      margin: 0 auto;
    }

    /* 모바일 화면용 레이아웃 */
    @media screen and (max-width: 768px) {
      .mandala-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 메인 목표 테이블(중앙 테이블)을 맨 위로 이동 */
      .mandala-container > div:nth-child(5) {
        order: -1;
        margin-bottom: 20px;
      }

      /* 각 테이블의 크기와 여백 조정 */
      .mandala-table {
        width: 100%;
        margin-bottom: 15px;
      }

      /* 서브 목표 테이블들의 제목이나 구분선 추가 (선택사항) */
      .mandala-container > div:not(:first-child) {
        padding-top: 15px;
        border-top: 1px solid #eaeaea;
      }
    }
    </style>

<script>
  DEBUG_MODE = false;
  document.getElementById('generateBtn').addEventListener('click', function() {
    const inputText = document.getElementById('listInput').value;
    if (inputText.trim() === '') {
      alert('목표 리스트를 입력해주세요!');
      return;
    }

    const selectedType = document.querySelector('input[name="mandalaType"]:checked').value;

    let resultHtml = '';
    if (selectedType === 'mandalart') {
      const mandalaData = parseListToMandalaData(inputText);
      resultHtml = generateMandalaTable(mandalaData);
    } else if (selectedType === 'mandalasquare') {
      const squareData = parseListToSubgoalSquareData(inputText);
      resultHtml = generateSubgoalSquareTable(squareData);
    }

    document.getElementById('mandalaResult').innerHTML = resultHtml;
    document.getElementById('downloadBtn').style.display = 'inline-block';
  });

  // 리스트 텍스트를 만다라트 데이터 구조로 변환 - depth 기반 버전
  function parseListToMandalaData(text) {
    // 줄 단위로 분리
    const lines = text.split('\n');
    const mandalaData = {
      center: '',
      subgoals: Array(8).fill().map(() => ({
        center: '',
        centerDimmed: false,
        subgoals: Array(8).fill('').map(() => ({ text: '', isDimmed: false }))
      }))
    };

    // 모든 항목을 depth 기준으로 분류
    let mainGoal = { text: '', isDimmed: false };
    let subGoals = [];

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line === '') continue;

      // * 개수로 depth 판단
      const stars = line.match(/\*/g) || [];
      const depth = stars.length;

      let content = line.replace(/^\*+\s*/, '').trim();

      // [x] 또는 [X] 체크 여부 확인
      const isChecked = /\[[xX]\]/.test(content);
      if(isChecked) {
      // * 기호와 [x]/[X] 표시 모두 제거한 실제 내용
      content = content.replace(/\[[xX]\]\s*/, '').trim();
      }


      if (content === '') continue;

      if (depth === 1) {
        // 첫 번째 depth 1 항목이 메인 목표
        if (mainGoal.text === '') {
          mainGoal = { text: content, isDimmed: isChecked };
        } else {
          // 나머지 depth 1 항목은 서브 목표
          subGoals.push({
            title: content,
            isDimmed: isChecked,
            details: []
          });
        }
      } else if (depth === 2 && subGoals.length > 0) {
        // depth 2 항목은 마지막 서브 목표의 세부 항목으로 추가
        subGoals[subGoals.length - 1].details.push({
          text: content,
          isDimmed: isChecked
        });
      }
    }

    // 메인 목표 설정
    mandalaData.center = mainGoal.text;
    mandalaData.centerDimmed = mainGoal.isDimmed;

    // 서브 목표와 세부 목표 설정 (최대 8개)
    for (let i = 0; i < Math.min(8, subGoals.length); i++) {
      mandalaData.subgoals[i].center = subGoals[i].title;
      mandalaData.subgoals[i].centerDimmed = subGoals[i].isDimmed;

      // 각 서브 목표의 세부 목표도 최대 8개만 설정
      for (let j = 0; j < Math.min(8, subGoals[i].details.length); j++) {
        mandalaData.subgoals[i].subgoals[j] = {
          text: subGoals[i].details[j].text,
          isDimmed: subGoals[i].details[j].isDimmed
        };
      }
    }

    debugs("Parsed Main Goal:", mainGoal);
    debugs("Parsed Sub Goals:", subGoals);
    debugs("Final Mandala Data:", mandalaData);

    return mandalaData;
  }

  function parseListToSubgoalSquareData(text) {
    const lines = text.split('\n');
    const subgoals = [];
    let currentSubgoal = null;

    for (let line of lines) {
      line = line.trim();
      if (line === '') continue;

      const depth = (line.match(/\*/g) || []).length;
      let content = line.replace(/^\*+\s*/, '').trim();
      const isDimmed = /\[[xX]\]/.test(content);
      if (isDimmed) content = content.replace(/\[[xX]\]\s*/, '').trim();

      if (depth === 1) {
        if (currentSubgoal) {
          subgoals.push(currentSubgoal);
        }
        currentSubgoal = {
          center: content,
          centerDimmed: isDimmed,
          details: []
        };
      } else if (depth === 2 && currentSubgoal) {
        currentSubgoal.details.push({ text: content, isDimmed });
      }
    }

    // 마지막 subgoal도 추가
    if (currentSubgoal) {
      subgoals.push(currentSubgoal);
    }

    // 최대 4개로 제한, 각 subgoal detail도 3개로 제한
    return {
      subgoals: subgoals.slice(0, 4).map(sg => ({
        center: sg.center,
        centerDimmed: sg.centerDimmed,
        details: sg.details.slice(0, 3)
      }))
    };
  }

  // 만다라트 렌더링 함수 (기존 코드에 추가)
  function renderMandalaTable(mandalaData) {
    // 중앙 셀 렌더링
    const centerCell = document.getElementById('center-cell');
    if (centerCell) {
      centerCell.textContent = mandalaData.center;
      if (mandalaData.centerDimmed) {
        centerCell.classList.add('dim-cell');
      } else {
        centerCell.classList.remove('dim-cell');
      }
    }

    // 서브목표 셀 렌더링
    for (let i = 0; i < mandalaData.subgoals.length; i++) {
      const subgoalCell = document.getElementById(`subgoal-${i}`);
      if (subgoalCell) {
        subgoalCell.textContent = mandalaData.subgoals[i].center;
        if (mandalaData.subgoals[i].centerDimmed) {
          subgoalCell.classList.add('dim-cell');
        } else {
          subgoalCell.classList.remove('dim-cell');
        }
      }

      // 세부 목표 셀 렌더링
      for (let j = 0; j < mandalaData.subgoals[i].subgoals.length; j++) {
        const detailCell = document.getElementById(`detail-${i}-${j}`);
        if (detailCell) {
          detailCell.textContent = mandalaData.subgoals[i].subgoals[j].text;
          if (mandalaData.subgoals[i].subgoals[j].isDimmed) {
            detailCell.classList.add('dim-cell');
          } else {
            detailCell.classList.remove('dim-cell');
          }
        }
      }
    }
  }

  // 만다라트 테이블 HTML 생성 (전체 9x9 그리드) - 수정버전
  function generateMandalaTable(data) {
    // 중앙 3x3 + 8개의 3x3 서브 테이블 = 9x9 그리드
    let tableHtml = '<div style="overflow-x: auto;" class="mandala-container">';

    // 3행의 큰 행 (각 행은 3개의 3x3 블록을 포함)
    for (let bigRow = 0; bigRow < 3; bigRow++) {
      tableHtml += '<div style="display: flex; margin-bottom: 10px;">';

      // 3열의 큰 열
      for (let bigCol = 0; bigCol < 3; bigCol++) {
        const bigIdx = bigRow * 3 + bigCol; // 0~8 (중앙이 4)

        // 각 위치에 3x3 테이블 생성
        tableHtml += '<table class="mandala-table" style="margin-right: 10px;">';

        // 현재 큰 테이블이 어떤 서브 목표를 표현하는지 계산
        let subgoalIdx;
        if (bigIdx < 4) {
          subgoalIdx = bigIdx;
        } else if (bigIdx > 4) {
          subgoalIdx = bigIdx - 1;
        }

        // 3x3 테이블 내부 행
        for (let row = 0; row < 3; row++) {
          tableHtml += '<tr>';

          // 3x3 테이블 내부 열
          for (let col = 0; col < 3; col++) {
            const cellIdx = row * 3 + col; // 0~8 (중앙이 4)
            let cellClass = 'mandala-cell';
            let content = '';

            // 세부 셀의 인덱스 계산 (0~7)
            let detailIdx;
            if (cellIdx < 4) {
              detailIdx = cellIdx;
            } else if (cellIdx > 4) {
              detailIdx = cellIdx - 1;
            }

            // 중앙 큰 테이블 (bigIdx === 4)
            if (bigIdx === 4) {
              if (row === 1 && col === 1) {
                // 전체 중앙
                cellClass += ' center-cell';
                content = data.center;
              } else if (cellIdx !== 4) {
                // 중앙 테이블의 주변 8칸 (메인 서브 목표들)
                content = data.subgoals[detailIdx]?.center || '';
              }
            } 
            // 서브 테이블들
            else {
              if (row === 1 && col === 1) {
                // 각 서브 테이블의 중앙
                cellClass += ' center-cell';
                content = data.subgoals[subgoalIdx]?.center || '';
                if(data.subgoals[subgoalIdx]?.isDimmed) {
                  cellClass += ' dim-cell';
                }
              } else if (cellIdx !== 4) {
                // 각 서브 테이블의 세부 목표들
                content = data.subgoals[subgoalIdx]?.subgoals[detailIdx].text || '';
                if(data.subgoals[subgoalIdx]?.subgoals[detailIdx].isDimmed) {
                  cellClass += ' dim-cell';
                }
              }
            }

            tableHtml += `<td class="${cellClass}">${content}</td>`;
          }
          tableHtml += '</tr>';
        }

        tableHtml += '</table>';
      }

      tableHtml += '</div>';
    }

    tableHtml += '</div>';
    return tableHtml;
  }

  function generateSubgoalSquareTable(data) {
    const table = [
      ['subgoal1-1', 'subgoal1-2', 'subgoal2-1', 'subgoal2-2'],
      ['subgoal1-3', 'subgoal1',   'subgoal2',   'subgoal2-3'],
      ['subgoal3-1', 'subgoal3',   'subgoal4',   'subgoal4-1'],
      ['subgoal3-2', 'subgoal3-3', 'subgoal4-2', 'subgoal4-3'],
    ];

    let html = '<table class="mandala-table">';

    for (let row = 0; row < 4; row++) {
      html += '<tr>';
      for (let col = 0; col < 4; col++) {
        const key = table[row][col];
        let cellClass = 'mandala-cell';
        let content = '';
        let areaClass = '';

        const match = key.match(/^subgoal(\d)(?:-(\d))?$/);
        if (match) {
          const idx = parseInt(match[1], 10) - 1;
          const subgoal = data.subgoals[idx];
          areaClass = `subgoal-${idx + 1}`;

          if (match[2]) {
            const detailIdx = parseInt(match[2], 10) - 1;
            if (subgoal?.details[detailIdx]) {
              content = subgoal.details[detailIdx].text;
              if (subgoal.details[detailIdx].isDimmed) {
                cellClass += ' dim-cell';
              }
            }
          } else {
            content = subgoal?.center || '';
            cellClass += ' center-cell';
            if (subgoal?.centerDimmed) {
              cellClass += ' dim-cell';
            }
          }
        }

        html += `<td class="${cellClass} ${areaClass}">${content}</td>`;
      }
      html += '</tr>';
    }

    html += '</table>';
    return html;
  }
  // 이미지 저장 기능 (나중에 구현)
  document.getElementById('downloadBtn').addEventListener('click', function() {
    alert('이미지 저장 기능은 준비중입니다!');
  });

  function initShareFeatures() {
    // 1. 링크 복사 기능
document.getElementById('copyLinkBtn').addEventListener('click', function() {
  // textarea에서 현재 입력된 데이터 가져오기
  const textareaContent = document.getElementById('listInput').value;
  
  if (!textareaContent.trim()) {
    alert('공유할 만다라트 데이터가 없습니다. 먼저 내용을 입력해주세요!');
    return;
  }
  
  try {
    // 텍스트 내용을 만다라트 데이터 구조로 파싱 (어떤 타입이든 파싱 시도)
    // 실제 생성은 selectedType에 따라 다르게 할 것이므로, 데이터 형식만 파싱
    const selectedType = document.querySelector('input[name="mandalaType"]:checked').value;
    let shareData = {};

    if (selectedType === 'mandalart') {
      shareData.type = 'mandalart';
      shareData.data = parseListToMandalaData(textareaContent);
    } else if (selectedType === 'mandalasquare') {
      shareData.type = 'mandalasquare';
      shareData.data = parseListToSubgoalSquareData(textareaContent);
    }
    
    // 데이터를 URL 파라미터로 인코딩
    const jsonData = JSON.stringify(shareData);
    const compressedData = compressData(jsonData);
    const shareUrl = `${window.location.origin}${window.location.pathname}?data=${compressedData}`;
    
    // 클립보드에 복사
    navigator.clipboard.writeText(shareUrl)
      .then(() => {
        alert('링크가 클립보드에 복사되었습니다! 원하는 곳에 붙여넣기 하세요.');
      })
      .catch(err => {
        console.error('링크 복사 실패:', err);
        fallbackCopyToClipboard(shareUrl);
      });
  } catch (error) {
    console.error('데이터 파싱 오류:', error);
    alert('만다라트 데이터 형식이 올바르지 않습니다. 형식을 확인해주세요.');
  }
});

// URL에서 공유된 데이터 로드하고 textarea에 채우기
window.addEventListener('load', function() {
  const urlParams = new URLSearchParams(window.location.search);
  const sharedData = urlParams.get('data');
  
  if (sharedData) {
    try {
      const decompressedData = decompressData(sharedData);
      const parsedShareData = JSON.parse(decompressedData); // { type: 'mandalart', data: {...} } 형태
      
      const mandalaType = parsedShareData.type;
      const mandalaContentData = parsedShareData.data;

      // 만다라트 데이터를 텍스트 형식으로 변환
      let textContent = '';
      if (mandalaType === 'mandalart') {
        textContent = convertMandalaDataToText(mandalaContentData);
      } else if (mandalaType === 'mandalasquare') {
        textContent = convertSubgoalSquareDataToText(mandalaContentData);
      }
      
      // textarea에 표시
      const textarea = document.getElementById('listInput');
      if (textarea) {
        textarea.value = textContent;
      }
      
      // 해당 mandalaType 라디오 버튼 선택
      const radioButtons = document.querySelectorAll('input[name="mandalaType"]');
      radioButtons.forEach(radio => {
        if (radio.value === mandalaType) {
          radio.checked = true;
        } else {
          radio.checked = false; // 다른 라디오 버튼은 체크 해제
        }
      });

      // 테이블 생성 버튼을 클릭하여 결과 표시
      document.getElementById('generateBtn').click();

      // 페이지 URL에서 파라미터 제거 (선택사항)
      window.history.replaceState({}, document.title, window.location.pathname);
    } catch (e) {
      console.error('공유된 데이터 로드 실패:', e);
    }
  }
});

// 만다라트 데이터를 텍스트 포맷으로 변환하는 함수 (9x9용)
function convertMandalaDataToText(mandalaData) {
  let result = '';
  
  // 메인 목표
  if (mandalaData.center) {
    result += `* ${mandalaData.center}${mandalaData.centerDimmed ? ' [X]' : ''}\n`;
  }
  
  // 서브 목표와 세부 목표
  mandalaData.subgoals.forEach(subgoal => {
    if (subgoal.center) {
      result += `* ${subgoal.center}${subgoal.centerDimmed ? ' [X]' : ''}\n`;
      
      // 세부 목표
      subgoal.subgoals.forEach(detail => {
        if (detail.text) {
          result += ` ** ${detail.text}${detail.isDimmed ? ' [X]' : ''}\n`;
        }
      });
    }
  });
  
  return result;
}

// 만다라스퀘어 데이터를 텍스트 포맷으로 변환하는 함수 (4x4용)
function convertSubgoalSquareDataToText(squareData) {
  let result = '';
  squareData.subgoals.forEach(subgoal => {
    if (subgoal.center) {
      result += `* ${subgoal.center}${subgoal.centerDimmed ? ' [X]' : ''}\n`;
      subgoal.details.forEach(detail => {
        if (detail.text) {
          result += ` ** ${detail.text}${detail.isDimmed ? ' [X]' : ''}\n`;
        }
      });
    }
  });
  return result;
}

  // URL 파라미터로 전달하기 위한 데이터 압축
  function compressData(jsonString) {
    // 간단한 base64 인코딩
    return btoa(encodeURIComponent(jsonString));
  }

  // 압축된 데이터 복원
  function decompressData(compressed) {
    return decodeURIComponent(atob(compressed));
  }

  // 클립보드 복사 대체 방법
  function fallbackCopyToClipboard(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
      document.execCommand('copy');
      alert('링크가 클립보드에 복사되었습니다! 원하는 곳에 붙여넣기 하세요.');
    } catch (err) {
      alert('클립보드 복사에 실패했습니다. 직접 선택하여 복사해주세요.');
      console.error('클립보드 복사 실패:', err);
    }

    document.body.removeChild(textArea);
  }
