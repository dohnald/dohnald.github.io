<!DOCTYPE html>
<html>
    {% include header.html %}
    <body>
        <ul>
            {% for post in site.posts %}
            <li>
                <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
                <span class="date">{{ post.date | date: "%Y-%m-%d" }}</span>
            </li>
            {% endfor %}
        </ul>
        {% include footer.html %}
    </body>
</html>
